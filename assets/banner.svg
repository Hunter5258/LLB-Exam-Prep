<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">LL.B. Study &amp; Revision</title>
  <desc id="banner-desc">A warm parchment banner with an open book and the words LL.B. Study and Revision.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f1e5"/>
      <stop offset="55%" stop-color="#f2ebdd"/>
      <stop offset="100%" stop-color="#e6d9c0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b4883c"/>
      <stop offset="50%" stop-color="#d9b76b"/>
      <stop offset="100%" stop-color="#b4883c"/>
    </linearGradient>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#b9a887" opacity="0.18"/>
      <circle cx="14" cy="10" r="0.8" fill="#b9a887" opacity="0.14"/>
      <circle cx="8" cy="19" r="0.7" fill="#b9a887" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#paper)"/>
  <rect width="1200" height="300" fill="url(#grain)"/>
  <rect x="18" y="18" width="1164" height="264" rx="10" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="244" rx="6" fill="none" stroke="#8c6d3f" stroke-width="1" opacity="0.45"/>

  <g transform="translate(96 92)" fill="none" stroke="#5b4327" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0 24 C 44 4, 88 4, 128 22 L128 118 C 88 100, 44 100, 0 120 Z" fill="#fbf7ee"/>
    <path d="M256 24 C 212 4, 168 4, 128 22 L128 118 C 168 100, 212 100, 256 120 Z" fill="#fbf7ee"/>
    <path d="M128 22 L128 118" stroke="url(#gold)" stroke-width="3"/>
    <g stroke="#a08b6a" stroke-width="2" opacity="0.75">
      <path d="M18 46 C 52 32, 88 34, 112 44"/>
      <path d="M18 64 C 52 50, 88 52, 112 62"/>
      <path d="M18 82 C 52 68, 88 70, 100 76"/>
      <path d="M144 44 C 168 34, 204 32, 238 46"/>
      <path d="M144 62 C 168 52, 204 50, 238 64"/>
      <path d="M156 76 C 168 70, 204 68, 238 82"/>
    </g>
  </g>

  <g fill="#3b2a17">
    <text x="410" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" letter-spacing="1">LL.B. Study <tspan fill="#a87c34">&amp;</tspan> Revision</text>
    <text x="412" y="176" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#6b5538" letter-spacing="3">SYLLABUS · PAPERS · PREDICTIONS · PRACTICE</text>
  </g>

  <rect x="410" y="202" width="430" height="3" rx="1.5" fill="url(#gold)"/>
  <text x="412" y="240" font-family="Georgia, serif" font-size="19" font-style="italic" fill="#7a6242">Small steps, every day, until the exam is yours.</text>
</svg>
